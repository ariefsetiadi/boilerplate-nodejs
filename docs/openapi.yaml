openapi: 3.0.3

info:
  title: My API
  version: 1.0.0
  description: REST API built with Node.js and Express

servers:
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check whether the API is running
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: API is running